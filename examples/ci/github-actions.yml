name: Terraform Policy Check

# Example workflow for consuming repos. Copy into .github/workflows/ and
# point working-directory at your Terraform root.

on:
  pull_request:
    paths:
      - "infra/**"
      - "policy-packs/**"
      - ".terraguard.yml"

jobs:
  terraguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install OPA
        run: bash ../scripts/install-opa.sh
        working-directory: .
      - name: Install TerraGuard
        run: pip install -e ..
        working-directory: .
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false
      - name: TerraGuard Scan
        id: scan
        continue-on-error: true
        run: |
          terraguard scan --tfplan tfplan --format json --output terraguard-results.json
          terraguard scan --tfplan tfplan --format sarif --output terraguard.sarif
          terraguard report --input terraguard-results.json --format markdown --output terraguard-report.md
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: infra/terraguard.sarif
      - name: Post sticky PR comment
        if: github.event_name == 'pull_request' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraguard comment --input terraguard-results.json --post
      - name: Fail job when scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
