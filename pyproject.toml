[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraguard-cli"
version = "0.1.0"
description = "Shift-left Terraform policy validation with OPA/Rego for AWS and EKS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TerraGuard CLI" }
]
dependencies = [
  "pyyaml>=6.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
terraguard = "terraguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["terraguard"]
artifacts = ["policy-packs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
