name: TerraGuard Demo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: bash scripts/install-opa.sh
      - name: Run Rego policy tests
        run: bash scripts/run-opa-tests.sh

  demo-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install OPA
        run: bash scripts/install-opa.sh
      - name: Install TerraGuard
        run: pip install -e ".[dev]"
      - name: Plan vulnerable AWS example
        run: bash scripts/generate-sample-plan.sh examples/terraform/vulnerable-aws
      - name: Scan vulnerable AWS example
        run: |
          terraguard scan \
            --plan-json examples/terraform/vulnerable-aws/tfplan.json \
            --policy-pack aws-foundation \
            --format json \
            --output examples/reports/vulnerable-aws-results.json || true
          terraguard scan \
            --plan-json examples/terraform/vulnerable-aws/tfplan.json \
            --policy-pack aws-foundation \
            --format sarif \
            --output examples/reports/vulnerable-aws.sarif || true
      - name: Assert AWS findings detected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("examples/reports/vulnerable-aws-results.json").read_text())
          ids = {f["policy_id"] for f in data["findings"]}
          required = {
              "TG_AWS_S3_001",
              "TG_AWS_EC2_001",
              "TG_AWS_EBS_001",
              "TG_AWS_KMS_001",
              "TG_AWS_SG_001",
              "TG_AWS_VPC_001",
              "TG_AWS_IAM_001",
          }
          missing = required - ids
          assert not missing, f"Missing expected findings: {missing}"
          assert data["failed"] is True
          assert data.get("schema_version")
          print(f"OK: {len(data['findings'])} findings")
          PY
      - name: Render PR comment markdown
        run: |
          terraguard comment \
            --input examples/reports/vulnerable-aws-results.json \
            --output examples/reports/vulnerable-aws-pr-comment.md \
            --title "TerraGuard AWS Foundation"
      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraguard comment \
            --input examples/reports/vulnerable-aws-results.json \
            --post \
            --title "TerraGuard AWS Foundation"
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: examples/reports/vulnerable-aws.sarif
          category: terraguard-aws-foundation
      - name: Plan vulnerable EKS example
        run: bash scripts/generate-sample-plan.sh examples/terraform/eks-vulnerable
      - name: Scan vulnerable EKS example
        run: |
          terraguard scan \
            --plan-json examples/terraform/eks-vulnerable/tfplan.json \
            --policy-pack aws-eks \
            --format json \
            --output examples/reports/eks-vulnerable-results.json || true
      - name: Assert EKS findings detected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("examples/reports/eks-vulnerable-results.json").read_text())
          ids = {f["policy_id"] for f in data["findings"]}
          required = {
              "TG_AWS_EKS_001",
              "TG_AWS_EKS_002",
              "TG_AWS_EKS_003",
              "TG_AWS_EKS_004",
              "TG_AWS_EKS_011",
          }
          missing = required - ids
          assert not missing, f"Missing expected findings: {missing}"
          assert data["failed"] is True
          print(f"OK: {len(data['findings'])} findings")
          PY
      - name: Coverage report
        run: |
          terraguard coverage --plan-json examples/terraform/vulnerable-aws/tfplan.json --as-json
      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraguard-demo-reports
          path: |
            examples/reports/*
            examples/terraform/*/tfplan.json
